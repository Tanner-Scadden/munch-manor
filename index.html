    <style>
      html {
        background: #160b24;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(circle at 50% 42%, #3b2160, #160b24 70%);
        color: #f4f1de;
        font:
          bold 14px/1.2 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        transition: opacity 0.2s linear;
      }
      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      .splash-zombie {
        width: 66px;
        height: 72px;
        shape-rendering: crispEdges;
        animation: splash-chomp 0.5s steps(2) infinite;
      }
      .splash-word {
        margin: 0;
        font-size: clamp(26px, 7vmin, 48px);
        letter-spacing: 0.12em;
        text-shadow:
          3px 3px 0 #140c10,
          -2px -2px 0 #140c10;
      }
      .splash-munch {
        color: #9be36a;
      }
      .splash-manor {
        color: #c9a0f0;
      }
      .splash-line {
        margin: 0;
        color: #b8c2b0;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      .splash-bar {
        position: relative;
        width: 160px;
        height: 8px;
        overflow: hidden;
        border: 2px solid #140c10;
        background: #24123a;
      }
      /* The slide moves with transform, not left, so the compositor runs it
         and it keeps moving while the game's script holds the main thread. */
      .splash-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 30%;
        background: #9be36a;
        animation: splash-slide 0.9s steps(8) infinite;
      }
      #splash[data-progress='Known'] .splash-fill {
        width: calc(var(--splash-progress, 0) * 100%);
        transform: none;
        animation: none;
      }
      @keyframes splash-chomp {
        to {
          transform: translateY(-3px);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(334%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-zombie,
        .splash-fill {
          animation: none;
        }
      }
    </style>
