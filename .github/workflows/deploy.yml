name: Deploy

# Pushes to main deploy production to Cloudflare once the checks pass. Each
# pull request deploys its own preview stage and comments its URL, and the
# preview is destroyed when the pull request closes. See infra/README.md.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}

jobs:
  # NOTE: the checks run as parallel legs, each on its own runner, so the
  # slowest leg (lint or the full test tier) sets the time instead of their
  # sum. Deploy waits for every leg.
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            run: bun run typecheck && cd infra && bun run typecheck
          # NOTE: the two type-aware lint passes each build the whole program,
          # so they run on separate legs.
          - name: oxlint
            run: bun run lint:oxlint
          - name: effect lint
            run: bun run lint:effect && bun run lint:rest && bun run lint:infra
          # NOTE: the full tier: the fast tests plus the sim tier (whole wave
          # replays and seed sweeps) that `bun run test` leaves out.
          - name: test
            run: bun run test:full
          # NOTE: world:check bundles the co-op room's step with no UI, art,
          # audio, or store module and plays it in workerd exactly as in Bun
          # (MULTIPLAYER.md, Phase 0).
          - name: build
            run: bun run world:check && bun run build && cd infra && bun run test
    name: check (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      # NOTE: oxlint runs in Node and loads the project's own rules
      # (tools/lint/munchPlugin.ts) as TypeScript, which Node strips natively
      # from 22.18 on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: infra
      # NOTE: the audit tools keep their own package.json, and typecheck
      # covers them, so their types (Bun, playwright-core) must be installed.
      - run: bun install --frozen-lockfile
        working-directory: tools/audit
      - run: ${{ matrix.run }}

  deploy:
    needs: check
    if: github.event.action != 'closed' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # NOTE: the whole history, so the site check can diff the build that is
      # live against this commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: infra
      - id: deploy
        name: Deploy ${{ env.STAGE }}
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
        run: |
          set -o pipefail
          bun alchemy deploy --stage "$STAGE" --yes --no-input | tee "$RUNNER_TEMP/deploy.log"
          # Any https host: production's outputs are its custom domains
          # (munchmanor.com, api.munchmanor.com), a preview's are workers.dev.
          output_url() {
            grep -oE "(^|[^A-Za-z])$1: 'https://[a-z0-9.-]+'" "$RUNNER_TEMP/deploy.log" |
              tail -n 1 | grep -oE "https://[a-z0-9.-]+"
          }
          echo "url=$(output_url url)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(output_url apiUrl)" >> "$GITHUB_OUTPUT"
      # NOTE: GitHub's datacenter IPs get a Cloudflare bot-protection 403
      # from the custom domain (munchmanor.com) while the site answers 200
      # to everyone else. The same Worker also serves from its workers.dev
      # address, which has no bot protection, so the hard check goes there:
      # the site answers 200 and its version.json is this very commit. The
      # custom domain is a soft check: a 403 there is a warning, anything
      # else that is not 200 still fails.
      - name: Check the site answers
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          test -n "$URL"
          if [ "$STAGE" = "prod" ]; then
            hard_url=https://munch-manor.tanner-scadden.workers.dev
          else
            hard_url="$URL"
          fi
          build_of() {
            curl -s "$hard_url/version.json?check=$1" | grep -oE '"build" *: *"[^"]*"' | grep -oE '"[^"]*"$' | tr -d '"' || true
          }
          # NOTE: the site is memoized on its inputs (infra/siteInputs.ts), so
          # a push that changes none of them leaves the live build, stamped
          # with the commit that last changed the site, in place. That build
          # is the one to want then; otherwise this commit's.
          wanted="$GITHUB_SHA"
          live=$(build_of live)
          if [ -n "$live" ] && [ "$live" != "$GITHUB_SHA" ] && git cat-file -e "$live^{commit}" 2>/dev/null \
            && git diff --name-only "$live" "$GITHUB_SHA" | xargs bun infra/sameSite.ts; then
            wanted="$live"
          fi
          # NOTE: a new build can take a couple of minutes to reach every
          # edge, so this waits up to three before it fails.
          for attempt in $(seq 1 36); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$hard_url/")
            build=$(build_of "$attempt")
            if [ "$status" = "200" ] && [ "$build" = "$wanted" ]; then
              echo "$hard_url answered 200 with build $build"
              break
            fi
            if [ "$attempt" = "36" ]; then
              echo "$hard_url answered $status with build '$build', wanted $wanted"
              exit 1
            fi
            sleep 5
          done
          if [ "$hard_url" != "$URL" ]; then
            status=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            case "$status" in
              200) echo "$URL answered 200" ;;
              403) echo "::warning::$URL answered 403 to GitHub's runner (Cloudflare bot protection); the workers.dev address above answered 200 with this build" ;;
              *) echo "$URL answered $status"; exit 1 ;;
            esac
          fi
      - name: Check the analytics API answers
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
        # NOTE: Cloudflare's bot protection can challenge GitHub's runner on
        # the custom domain, so production's health is checked at the API's
        # workers.dev address, as the site's build is above.
        run: |
          test -n "$API_URL"
          if [ "$STAGE" = "prod" ]; then
            hard_url=https://munch-manor-api.tanner-scadden.workers.dev
          else
            hard_url="$API_URL"
          fi
          healthy=false
          for attempt in $(seq 1 12); do
            body=$(curl -s "$hard_url/api/health" || true)
            if [ "$body" = '{"status":"Ok","database":"Ok"}' ]; then
              echo "$hard_url/api/health answered $body"
              healthy=true
              break
            fi
            sleep 5
          done
          if [ "$healthy" != true ]; then
            echo "$hard_url/api/health answered $body"
            exit 1
          fi
          if [ "$hard_url" != "$API_URL" ]; then
            status=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/api/health")
            case "$status" in
              200) echo "$API_URL/api/health answered 200" ;;
              403) echo "::warning::$API_URL answered 403 to GitHub's runner (Cloudflare bot protection); the workers.dev address above is healthy" ;;
              *) echo "$API_URL/api/health answered $status"; exit 1 ;;
            esac
          fi
      # NOTE: production also answers at its old workers.dev addresses, on
      # purpose: saves and installed apps are bound to their origin, so they
      # must keep serving (see "Two origins" in PLATFORM.md).
      - name: Check the old addresses still answer
        if: env.STAGE == 'prod'
        run: |
          for url in https://munch-manor.tanner-scadden.workers.dev/ https://munch-manor-api.tanner-scadden.workers.dev/api/health; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            echo "$url answered $status"
            test "$status" = "200"
          done

  # NOTE: production also plays on itch.io
  # (https://tannerscadden.itch.io/munch-manor). After a deploy to main, the
  # same commit is built for itch (tools/itch/build.sh) and pushed with butler,
  # unless nothing the site is built from changed since the build itch has
  # (infra/sameSite.ts), so a push of docs or CI makes no new itch build.
  itch:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: infra
      - name: Install butler
        run: |
          curl -sSfL -o "$RUNNER_TEMP/butler.zip" https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Push the build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TARGET: tannerscadden/munch-manor:html5
        run: |
          live=$(butler status "$TARGET" | grep -oE 'itch-[0-9a-f]+' | head -1 | sed 's/^itch-//' || true)
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null \
            && git diff --name-only "$live" "$GITHUB_SHA" | xargs bun infra/sameSite.ts; then
            echo "itch.io already has build itch-$live, and nothing the site is built from changed since"
            exit 0
          fi
          bun run build:itch
          zip=$(ls tools/itch/out/munch-manor-itch-*.zip)
          butler push "$zip" "$TARGET" --userversion "$(basename "$zip" .zip | sed 's/^munch-manor-//')"

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: infra
      - name: Refuse to destroy production
        run: |
          case "$STAGE" in
            pr-*) ;;
            *) echo "Refusing to destroy stage $STAGE"; exit 1 ;;
          esac
      - name: Destroy ${{ env.STAGE }}
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
        run: bun alchemy destroy --stage "$STAGE" --yes --no-input
